name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore projekt
        run: dotnet restore; dotnet publish -o site;

      - name: Publish
        run: dotnet publish CICD_kryptering.csproj -c Release -o out

      - name: create zip package
        run: cd site; zip ../site.zip*;
        

      - name: Deploy to aws EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID}}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: Uppgiften
          environment_name: Uppgiften-env 
          version_label: ${{ github.run_id }}
          region: us-east-1
          deployment_package: site.zip
